services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inunity}
      POSTGRES_USER: ${POSTGRES_USER:-inunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inunity-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inunity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  inunity-postgres:
